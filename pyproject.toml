[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-soc-env"
version = "1.0.0"
description = "CyberSOC OpenEnv – AI-driven Security Operations Center training environment"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Shaik Wasim", email = "shaik347@example.com"},
]
keywords = ["cybersecurity", "soc", "openenv", "ai-agents", "rl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

dependencies = [
    "openenv-core",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "requests>=2.25.0"
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "black==24.4.2",
    "ruff==0.4.4",
]

[project.scripts]
cybersoc-serve = "cyber_soc_env.api.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
